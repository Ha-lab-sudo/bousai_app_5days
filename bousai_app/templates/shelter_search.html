{% extends "base.html" %}

{% block content %}
<style>
	.search-page {
		max-width: 1080px;
		margin: 0 auto;
	}

	.search-title {
		margin: 0 0 28px;
		color: #1c478f;
		font-size: clamp(28px, 4vw, 40px);
		line-height: 1.3;
	}

	.search-form {
		display: grid;
		grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
		gap: 30px 72px;
		padding: 34px 42px 38px;
		border: 2px solid #d6dde8;
		border-radius: 14px;
		background: #fff;
		box-shadow: 0 8px 24px rgb(37 64 102 / 10%);
	}

	.form-field { min-width: 0; }

	.field-label {
		display: block;
		margin-bottom: 12px;
		color: #182b48;
		font-size: 24px;
		font-weight: 700;
		line-height: 1.4;
	}

	.required { color: #bd2b2b; font-size: .72em; }

	.select-field {
		width: min(100%, 360px);
		min-height: 58px;
		padding: 9px 44px 9px 14px;
		border: 2px solid #8a96a7;
		border-radius: 6px;
		color: #1f2f46;
		background: #fff;
		font-size: 20px;
		cursor: pointer;
	}

	.select-field:focus,
	.check-field:focus-visible,
	.button:focus-visible {
		outline: 4px solid #f5c542;
		outline-offset: 3px;
	}

	.conditions {
		display: grid;
		gap: 17px;
		padding-top: 2px;
	}

	.check-label {
		display: flex;
		align-items: center;
		gap: 12px;
		min-height: 38px;
		color: #26354b;
		font-size: 21px;
		cursor: pointer;
	}

	.check-field {
		width: 25px;
		height: 25px;
		margin: 0;
		accent-color: #1e5aa8;
		cursor: pointer;
	}

	.search-message {
		grid-column: 1 / -1;
		min-height: 56px;
		padding: 14px 16px;
		border: 2px solid #c93434;
		color: #a51f1f;
		background: #fff5f5;
		font-size: 18px;
	}

	.search-message:empty { display: none; }

	.form-actions {
		grid-column: 1 / -1;
		display: flex;
		align-items: center;
		justify-content: space-between;
		margin-top: 8px;
	}

	.action-group {
		display: flex;
		align-items: center;
		gap: 24px;
	}

	.button {
		min-height: 58px;
		padding: 10px 30px;
		border: 2px solid #8995a5;
		border-radius: 4px;
		font-size: 21px;
		cursor: pointer;
	}

	.reset-button { color: #253043; background: #fffde4; }
	.submit-button { min-width: 220px; color: #192c44; background: #dcebf9; }
	.home-button {
		color: #253043;
		background: #e5e5e5;
		text-decoration: none;
		display: inline-flex;
		align-items: center;
		justify-content: center;
	}
	.button:hover { filter: brightness(.97); }

	@media (max-width: 760px) {
		.search-form {
			grid-template-columns: 1fr;
			padding: 24px 20px 28px;
			gap: 25px;
		}

		.field-label { font-size: 22px; }
		.select-field { width: 100%; }
		.search-message, .form-actions { grid-column: auto; }
		.form-actions { align-items: stretch; gap: 16px; }
		.action-group { flex: 1; gap: 12px; }
		.button { flex: 1; padding-inline: 15px; }
	}
</style>

<section class="search-page">
	<h2 class="search-title">避難所を検索</h2>

	<form class="search-form" method="get" action="{{ url_for('search_results') }}">
		<div class="form-field">
			<label class="field-label" for="area">1. エリア <span class="required">（必須）</span></label>
			<select class="select-field" id="area" name="area" required>
				<option value="">選択してください</option>
				<option value="北側">北側</option>
				<option value="南側">南側</option>
			</select>
		</div>

		<fieldset class="form-field" style="border: 0; padding: 0; margin: 0;">
			<legend class="field-label">3. 個別条件</legend>
			<div class="conditions">
				<label class="check-label" for="pet-ok">
					<input class="check-field" id="pet-ok" type="checkbox" name="pet_ok" value="1">
					ペット同伴可
				</label>
				<label class="check-label" for="wheelchair-ok">
					<input class="check-field" id="wheelchair-ok" type="checkbox" name="wheelchair_ok" value="1">
					車椅子対応可
				</label>
				<label class="check-label" for="toilet-ok">
					<input class="check-field" id="toilet-ok" type="checkbox" name="multipurpose_toilet" value="1">
					多目的トイレあり
				</label>
			</div>
		</fieldset>

		<div class="form-field">
			<label class="field-label" for="district">2. 町名 <span class="required">（任意）</span></label>
			<select class="select-field" id="district" name="district">
				<option value="">選択してください</option>
				<option value="青柳">青柳</option>
				<option value="旭町">旭町</option>
				<option value="安方">安方</option>
				<option value="石江">石江</option>
				<option value="大野">大野</option>
				<option value="沖館">沖館</option>
				<option value="幸畑">幸畑</option>
				<option value="篠田">篠田</option>
				<option value="新町">新町</option>
				<option value="筒井">筒井</option>
				<option value="佃">佃</option>
				<option value="戸山">戸山</option>
				<option value="長島">長島</option>
				<option value="浪岡">浪岡</option>
				<option value="浜田">浜田</option>
				<option value="古川">古川</option>
				<option value="本町">本町</option>
				<option value="松森">松森</option>
				<option value="三内">三内</option>
				<option value="緑">緑</option>
				<option value="妙見">妙見</option>
				<option value="八重田">八重田</option>
				<option value="矢田前">矢田前</option>
				<option value="柳川">柳川</option>
				<option value="横内">横内</option>
			</select>
		</div>

		<p class="search-message" id="searchMessage" role="alert" aria-live="polite"></p>

		<div class="form-actions">
			<a class="button home-button" href="{{ url_for('index') }}">ホームに戻る</a>
			<div class="action-group">
				<button class="button reset-button" type="reset">リセット</button>
				<button class="button submit-button" type="submit">検索</button>
			</div>
		</div>
	</form>
</section>

<script>
	document.querySelector('.search-form').addEventListener('submit', function(event) {
		const area = document.getElementById('area');
		const message = document.getElementById('searchMessage');

		if (!area.value) {
			event.preventDefault();
			message.textContent = 'エリアを選択してください。';
			area.focus();
		} else {
			message.textContent = '';
		}
	});

	document.querySelector('.search-form').addEventListener('reset', function() {
		document.getElementById('searchMessage').textContent = '';
	});
</script>
{% endblock %}
