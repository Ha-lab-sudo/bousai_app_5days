{% extends "base.html" %}

{% block content %}
<style>
    .home-card {
        margin-bottom: 34px;
        padding: 28px;
        border: 1px solid #f0f3f8;
        border-radius: 17px;
        background: #fff;
        box-shadow: 0 8px 25px rgb(55 81 117 / 8%);
    }

    .home-heading {
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 0 0 20px;
        color: var(--ink);
        font-size: 24px;
        font-weight: 700;
    }

    .heading-icon { font-size: 25px; }

    #shelterMap {
        height: 270px;
        overflow: hidden;
        border-radius: 11px;
    }

    .weather-heading { justify-content: space-between; }

    .refresh-label {
        color: #2caa58;
        font-size: 16px;
        font-weight: 700;
        white-space: nowrap;
    }

    .weather-panel {
        min-height: 150px;
        padding: 20px;
        border-radius: 12px;
        background: #f7f8fa;
    }

    .weather-panel p { margin: 0 0 11px; }
    .weather-panel p:last-child { margin-bottom: 0; }
    .weather-location { font-size: 18px; font-weight: 700; }
    .weather-clear { color: #25a652; font-size: 18px; font-weight: 700; }
    .weather-meta { color: #63738a; font-size: 14px; }

    @media (max-width: 600px) {
        .home-card { padding: 18px; margin-bottom: 20px; }
        .home-heading { font-size: 20px; }
        #shelterMap { height: 240px; }
        .weather-heading { align-items: flex-start; flex-direction: column; gap: 5px; }
        .refresh-label { font-size: 14px; }
    }
</style>

<section class="home-card">
    <h2 class="home-heading"><span class="heading-icon">📍</span>避難所マップ</h2>
    <div id="shelterMap"></div>
</section>

<!-- 気象警報・注意報 -->
<section class="home-card">
    <h2 class="home-heading weather-heading">
        <span><span class="heading-icon">🌤️</span> {{ '青森市' }} 気象警報・注意報</span>
        <span class="refresh-label">🔄 10分おき自動更新</span>
    </h2>
    <div id="weatherContent" class="weather-panel">
        <p>読み込み中...</p>
    </div>
</section>

<!-- Leaflet の読み込み -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // 地図の初期化（藤沢市周辺を中心に設定）
    const map = L.map('shelterMap').setView([35.3390, 139.4903], 12);

    // OpenStreetMapタイルを追加
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        referrerPolicy: 'strict-origin-when-cross-origin'
    }).addTo(map);

    // 気象警報・注意報の自動更新機能
    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => {
                console.log('気象情報を更新しました:', data);
                updateWeatherContent(data);
            })
            .catch(error => {
                console.error('気象情報の更新に失敗しました:', error);
            });
    }

    function updateWeatherContent(data) {
        const weatherContent = document.getElementById('weatherContent');

        if (data.error) {
            weatherContent.innerHTML = '<p class="weather-clear">気象情報の取得に失敗しました</p>';
            return;
        }

        let warningsHtml = '';
        if (data.warnings && data.warnings.length > 0) {
            warningsHtml = '<ul>';
            data.warnings.forEach(warning => {
                warningsHtml += `<li>${warning.name}（${warning.status}）</li>`;
            });
            warningsHtml += '</ul>';
        } else {
            warningsHtml = '<p class="weather-clear">✅ 現在、警報・注意報は発表されていません</p>';
        }

        weatherContent.innerHTML = `
            <p class="weather-location">📍 ${data.area_name || '青森市'}</p>
            ${warningsHtml}
            <p class="weather-meta">🕘 データ取得: <span id="lastFetchTime">${data.last_fetch_time || '更新中...'}</span></p>
            <p class="weather-meta">📡 気象庁発表: ${data.report_time || '不明'}</p>
        `;
    }

    // 初回表示＋10分（600,000ミリ秒）おきに自動更新
    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
